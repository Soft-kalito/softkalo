<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/estilovideos.css">
    <title>Mi Playlist de Videos Favoritos</title>
</head>
<body>

    <div class="main-container">
        
        <!-- COLUMNA IZQUIERDA: EL REPRODUCTOR -->
        <div class="video-player-container">
            <div class="video-wrapper">
                <!-- Por defecto se carga un reproductor HTML5 con el primer video -->
                <video id="main-video" controls src="../Multimedia/videoplayback.mp4"></video>
                <!-- Si se usa YouTube, el script reemplazará dinámicamente este contenedor -->
            </div>
            <div class="video-info-box">
                <h2 id="player-title">Selecciona un video</h2>
                <p id="player-artist">Artista / Canal</p>
            </div>
        </div>

        <!-- COLUMNA DERECHA: LA LISTA DE VIDEOS -->
        <div class="playlist-container">
            <div class="playlist-header">
                <h1>Videos Recientes</h1>
            </div>
            
            <div class="video-list">

                <!-- Video 1 (Local) -->
                <div class="video-item active" data-type="local" data-src="../Multimedia/videoplayback.mp4">
                    <div class="video-thumbnail">🎬</div>
                    <div class="video-details">
                        <h3 class="video-title">Mi Video Local 1</h3>
                        <p class="video-artist">Grabación de Prueba</p>
                    </div>
                </div>

                <!-- Video 2 (Local) -->
                <div class="video-item" data-type="local" data-src="../Multimedia/Perfect.mp4">
                    <div class="video-thumbnail">🎬</div>
                    <div class="video-details">
                        <h3 class="video-title">Mi Video Local 2</h3>
                        <p class="video-artist">Efectos Especiales</p>
                    </div>
                </div>

                <!-- Video 3 (YouTube - Ejemplo de integración de red) -->
                <!-- Para YouTube, usa solo el código final de la URL del video -->
                <div class="video-item" data-type="local" data-src="../Multimedia/Innocence.mp4">
                    <div class="video-thumbnail">📺</div>
                    <div class="video-details">
                        <h3 class="video-title">Never Gonna Give You Up</h3>
                        <p class="video-artist">Rick Astley (YouTube)</p>
                    </div>
                </div>

                <!-- Video 4 (YouTube) -->
                <div class="video-item" data-type="local" data-src="../Multimedia/Perfect.mp4">
                    <div class="video-thumbnail">📺</div>
                    <div class="video-details">
                        <h3 class="video-title">Clarity</h3>
                        <p class="video-artist">Zedd ft. Foxes</p>
                    </div>
                </div>

                <!-- Video 5 (YouTube) -->
                <div class="video-item" data-type="local" data-src="../Multimedia/Innocence.mp4">
                    <div class="video-thumbnail">📺</div>
                    <div class="video-details">
                        <h3 class="video-title">Clarity</h3>
                        <p class="video-artist">Zedd ft. Foxes</p>
                    </div>
                </div>

            </div>
        </div>

    </div>

    <!-- ==========================================================================
         5. INTERACTIVIDAD CON JAVASCRIPT
         ========================================================================== */ -->
    <script>
        const videoWrapper = document.querySelector('.video-wrapper');
        const playerTitle = document.getElementById('player-title');
        const playerArtist = document.getElementById('player-artist');
        const videoItems = document.querySelectorAll('.video-item');

        // Función para cambiar de video
        function playVideo(item) {
            const videoType = item.getAttribute('data-type');
            const videoSrc = item.getAttribute('data-src');
            const title = item.querySelector('.video-title').textContent;
            const artist = item.querySelector('.video-artist').textContent;

            // Actualizar textos informativos abajo del video
            playerTitle.textContent = title;
            playerArtist.textContent = artist;

            // Remover borde "activo" de todos los elementos y ponerlo en el seleccionado
            videoItems.forEach(i => i.classList.remove('active'));
            item.classList.add('active');

            if (videoType === 'local') {
                // Si es un archivo local (.mp4), inyectamos una etiqueta <video> normal
                videoWrapper.innerHTML = `<video id="main-video" controls autoplay src="${videoSrc}"></video>`;
            } else if (videoType === 'youtube') {
                // Si es de YouTube, inyectamos un iframe con el reproductor incrustado oficial
                videoWrapper.innerHTML = `                    
                    <iframe 
                        src="https://www.youtube.com/embed/${videoSrc}?autoplay=1&origin=https://youtube.com" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                        allowfullscreen>
                    </iframe>`;
            }
        }

        /*
                    <iframe 
                        src="https://www.youtube.com/embed/${videoSrc}?autoplay=1" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                        allowfullscreen>
                    </iframe>`;
        */
        // Configurar evento de clic en cada tarjeta de la lista
        videoItems.forEach(item => {
            item.addEventListener('click', () => {
                playVideo(item);
            });
        });

        // Cargar los datos del primer video por defecto al abrir la página (sin reproducir automáticamente)
        if (videoItems.length > 0) {
            const firstItem = videoItems[0];
            playerTitle.textContent = firstItem.querySelector('.video-title').textContent;
            playerArtist.textContent = firstItem.querySelector('.video-artist').textContent;
        }
    </script>
</body>
</html>
