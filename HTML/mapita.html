<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/estilomapa.css">

    <title>Ubicación | Lonya Grande, Amazonas</title>
    
    <!-- Librería Leaflet y Fuentes -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
    </style>
</head>
<body>

    <div class="card-container">
        <!-- Panel de Información Flotante -->
        <div class="info-panel">
            <span class="region-tag">Amazonas, Perú</span>
            <h2>Lonya Grande</h2>
            <p>Distrito de la provincia de Utcubamba, rodeado de valles, selva alta y una rica herencia cultural.</p>
            
            <div class="coords-box">
                <span>LAT: -6.0969</span>
                <span>LNG: -78.4233</span>
            </div>

            <div class="status-badge">
                <div class="pulse-dot"></div>
                <span>Punto de Interés Fijo</span>
            </div>
        </div>

        <!-- Contenedor del Mapa -->
        <div id="map"></div>
    </div>

    <!-- Librería Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // 1. Coordenadas fijas de Lonya Grande
        const latLonya = -6.0969;
        const lngLonya = -78.4233;

        // 2. Inicializar el mapa centrado en Lonya Grande (Zoom nivel 14)
        const map = L.map('map', { zoomControl: false }).setView([latLonya, lngLonya], 14);

        // Control de zoom abajo a la derecha
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // Capa base de mapas
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // 3. Agregar marcador fijo con mensaje emergente
        const marker = L.marker([latLonya, lngLonya]).addTo(map);
        
        marker.bindPopup(`
            <div style="text-align: center; padding: 5px;">
                <b style="color: #38bdf8; font-size: 14px;">Lonya Grande</b><br>
                <span style="font-size: 12px; color: #cbd5e1;">Utcubamba, Amazonas</span>
            </div>
        `).openPopup();
    </script>
</body>
</html>
