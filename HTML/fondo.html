<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/estilofondo.css">
    <title>Portada Amazonas - Arte Rupestre</title>
    <style>

    </style>
</head>
<body>

    <div class="canvas">
        <!-- Luz suave -->
        <div class="light-glow"></div>

        <!-- Hojas de Selva (SVG) -->
        <svg class="jungle-leaves top-left" viewBox="0 0 100 100">
            <path d="M10,10 Q50,0 80,40 Q50,80 10,10 Z" />
            <path d="M5,25 Q45,15 75,55 Q45,95 5,25 Z" />
            <path d="M25,5 Q65,-5 95,35 Q65,75 25,5 Z" />
        </svg>

        <svg class="jungle-leaves bottom-right" viewBox="0 0 100 100">
            <path d="M10,10 Q50,0 80,40 Q50,80 10,10 Z" />
            <path d="M5,25 Q45,15 75,55 Q45,95 5,25 Z" />
        </svg>

        <!-- Título -->
        <div class="header">
            <h1 class="title">AMAZONAS</h1>
            <p class="subtitle">El Arte Ancestral en la Roca</p>
        </div>

        <!-- Figura Rupestre Ocre -->
        <div class="cave-art-container">
            <svg class="rupestre-svg" viewBox="0 0 100 100">
                <!-- Cabeza y sol rupestre -->
                <circle cx="50" cy="22" r="8" />
                <circle cx="50" cy="22" r="14" stroke="#b23b23" stroke-width="2" fill="none" stroke-dasharray="3,2" />
                
                <!-- Cuerpo -->
                <line x1="50" y1="36" x2="50" y2="65" stroke="#b23b23" stroke-width="5" stroke-linecap="round" />
                
                <!-- Brazos hacia arriba (Típico arte rupestre antropomorfo) -->
                <path d="M 25 32 Q 35 48 50 42 Q 65 48 75 32" stroke="#b23b23" stroke-width="4.5" fill="none" stroke-linecap="round" />
                
                <!-- Piernas -->
                <path d="M 50 65 L 32 90" stroke="#b23b23" stroke-width="4.5" stroke-linecap="round" />
                <path d="M 50 65 L 68 90" stroke="#b23b23" stroke-width="4.5" stroke-linecap="round" />
                
                <!-- Detalle Soles/Símbolos laterales -->
                <circle cx="20" cy="20" r="3" />
                <circle cx="80" cy="20" r="3" />
            </svg>
        </div>

        <!-- Slogan Turístico -->
        <div class="slogan-box">
            <p class="slogan">"Donde la roca aún guarda el primer trazo<br>de la historia."</p>
        </div>

        <!-- Pie de página / Info del Trabajo -->
        <div class="footer">
            <div class="authors">
                <strong>PRESENTADO POR:</strong>
                Ing. César Augusto Caicay Llontop
            </div>
            <div style="text-align: right;">
                <strong>IESTP "LONYA GRANDE"</strong>
                Computación e Informática
            </div>
        </div>
    </div>

</body>
</html>
